quarkus.http.port=8081
# CORS Configuration
quarkus.http.cors.origins=http://localhost:8083
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=*

quarkus.oidc.auth-server-url=http://localhost:8180/realms/pethouse
quarkus.oidc.client-id=animal-service
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=http://localhost:8180/realms/pethouse

quarkus.http.auth.permission.public.paths=/q/health/*,/q/metrics
quarkus.http.auth.permission.public.policy=permit

quarkus.http.auth.permission.authenticated.paths=/animals/*
quarkus.http.auth.permission.authenticated.policy=authenticated

quarkus.log.console.enable=true
quarkus.log.console.level=INFO
quarkus.log.category."io.quarkus.oidc".level=DEBUG
quarkus.log.category."io.smallrye.reactive.messaging.rabbitmq".level=DEBUG

%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/pethouse
%dev.quarkus.oidc.client-id=animal-service

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=1234567890
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/pethouse?currentSchema=animal

# Hibernate Configuration
# Use 'drop-and-create' in dev mode to fix ID generation issue (deletes all data)
# Use 'update' in production to preserve data
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.database.default-schema=animal
quarkus.hibernate-orm.log.sql=false

%prod.quarkus.oidc.auth-server-url=http://localhost:8180/realms/pethouse
%prod.quarkus.oidc.client-id=animal-service
%prod.quarkus.oidc.token-state-manager.split-tokens=true

# RabbitMQ Configuration (Quarkus in Action 9.7)
mp.messaging.incoming.adoption-in.connector=smallrye-rabbitmq
mp.messaging.incoming.adoption-in.queue.name=adoption-queue
mp.messaging.incoming.adoption-in.durable=true

# Internal channel (no RabbitMQ configuration needed)
# adoption-processed is an internal channel between processors

# Outgoing channel for confirmations (optional - uncomment if needed)
# mp.messaging.outgoing.adoption-confirmations.connector=smallrye-rabbitmq
