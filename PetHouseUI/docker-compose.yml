version: '3.8'

services:
  postgres:
    container_name: postgres
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    networks:
      - keycloak_network

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak-pethouse
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KEYCLOAK_IMPORT: /opt/keycloak/data/import/pethouse-realm.json
    ports:
      - "8180:8080"
    restart: always
    command:
      - start-dev
      - --import-realm
    volumes:
        - D:\nastya\crossplatform\PetHouse\PetHouseUI\pethouse-realm.json:/opt/keycloak/data/import/pethouse-realm.json

    depends_on:
      - postgres
    networks:
      - keycloak_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  keycloak-data:
    driver: local

networks:
  keycloak_network:
    driver: bridge
